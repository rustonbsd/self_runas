[package]
name = "self_runas"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
nix = { version = "0.30", features = ["user"] }
runas = { git="https://github.com/rustonbsd/rust-runas", branch = "master" }

#[target.'cfg(windows)'.dependencies]
winapi = { version = "*", features = ["processthreadsapi", "securitybaseapi", "winnt", "handleapi"] }