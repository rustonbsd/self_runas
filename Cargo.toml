[package]
name = "self-runas"
description = "run application with sudo/admin privileges"
license = "MIT"
authors = ["Zacharias Boehler <rustonbsd@mailfence.com>"]
repository = "https://github.com/rustonbsd/self_runas"
readme = "README.md"
version = "0.1.1"
edition = "2024"


[dependencies]
thiserror = "2"
nix = { version = "0.31", features = ["user"] }
runas-with-inherited-cmd = "1.2.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "processthreadsapi",
    "securitybaseapi",
    "winnt",
    "handleapi",
] }
